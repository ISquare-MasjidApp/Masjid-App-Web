name: Masjid App Web Build & Deploy

on:
  push:
    branches:
      - dev
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Deployment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dev
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/masjid-app-frontend:dev-latest
          # Baked into the image at build time and consumed by next.config.ts
          # rewrites. Set a BACKEND_API_URL secret to override the default.
          build-args: |
            BACKEND_API_URL=${{ secrets.BACKEND_API_URL || 'https://api.masjid-app.isquaretechsolutions.com' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: Deployment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display Selected Environment
        run: |
          echo "Environment = ${{ github.event.inputs.environment }}"

      - name: Create application directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            mkdir -p ~/masjid-frontend

      - name: Copy docker-compose
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: "./docker-compose.yml"
          target: "~/masjid-frontend"

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            cd ~/masjid-frontend

            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            # No `infisical run` wrapper here, unlike the backend: this compose
            # file has no secrets to inject. DOCKER_USERNAME comes from GitHub
            # above, and BACKEND_API_URL / FRONTEND_TAG both carry defaults.

            docker compose pull

            docker compose up -d --force-recreate --remove-orphans

            docker image prune -f
